name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra serving

      - name: Lint
        run: uv run ruff check .

      - name: Generate sample data
        run: uv run python scripts/00_generate_sample_data.py

      - name: Run tests
        run: uv run pytest --cov-report=xml

      - name: Run full pipeline smoke test
        run: |
          uv run python scripts/01_process_data.py
          uv run python scripts/02_train_model.py
          uv run python scripts/03_evaluate_model.py
          uv run python scripts/05_refresh_monitor.py

      - name: Build Docker image
        run: docker build -t pm-mlops:ci .
