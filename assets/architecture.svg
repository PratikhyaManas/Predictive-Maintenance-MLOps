    <path d="M430 320H470" stroke="#4B5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1130 320H1160" stroke="#4B5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="228" y="520" width="1144" height="330" rx="26" class="card"/>
    <rect x="252" y="542" width="210" height="52" rx="16" fill="#F1F5F9"/>
    <text x="290" y="576" class="section">4. Serving + Monitoring</text>

    <g transform="translate(310 640)">
      <rect x="0" y="0" width="200" height="142" rx="22" fill="#FFFFFF" stroke="#D7E7F7"/>
      <rect x="24" y="18" width="152" height="86" rx="14" fill="#EFF6FF"/>
      <rect x="40" y="36" width="34" height="48" rx="8" fill="#2563EB"/>
      <rect x="80" y="26" width="76" height="12" rx="6" fill="#93C5FD"/>
      <rect x="80" y="46" width="62" height="12" rx="6" fill="#DBEAFE"/>
      <rect x="80" y="66" width="58" height="12" rx="6" fill="#DBEAFE"/>
      <text x="100" y="120" text-anchor="middle" class="tiny">FastAPI service</text>
    </g>

    <g transform="translate(580 640)">
      <rect x="0" y="0" width="200" height="142" rx="22" fill="#FFFFFF" stroke="#D7E7F7"/>
      <path d="M40 32H160" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
      <path d="M40 54H140" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
      <path d="M40 76H126" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="152" cy="76" r="18" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
      <path d="M143 76H161" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
      <path d="M152 67V85" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
      <text x="100" y="120" text-anchor="middle" class="tiny">/predict + /predict/batch</text>
    </g>

    <g transform="translate(850 640)">
      <rect x="0" y="0" width="200" height="142" rx="22" fill="#FFFFFF" stroke="#D7E7F7"/>
      <path d="M38 32H162" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M66 60H134" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 88H150" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 18V100" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="20" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/>
      <text x="100" y="120" text-anchor="middle" class="tiny">/metrics</text>
    </g>

    <g transform="translate(1120 640)">
      <rect x="0" y="0" width="200" height="142" rx="22" fill="#FFFFFF" stroke="#D7E7F7"/>
      <path d="M58 31H142" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <rect x="62" y="45" width="76" height="48" rx="10" fill="#E0F2FE"/>
      <path d="M75 58H129" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
      <path d="M75 72H117" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
      <path d="M47 102H153" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <text x="100" y="120" text-anchor="middle" class="tiny">Drift monitoring</text>
    </g>

    <path d="M510 711H580" stroke="#4B5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M780 711H850" stroke="#4B5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1050 711H1120" stroke="#4B5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="780" y="815" text-anchor="middle" class="label">Operational feedback loop</text>
    <text x="780" y="840" text-anchor="middle" class="tiny">risk alerts · maintenance actions · monitoring reports</text>
  </g>

  <g>
    <path d="M1270 460V520" stroke="#4B5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M900 460V520" stroke="#4B5563" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  </g>
</svg>
