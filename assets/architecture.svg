<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="120" y1="80" x2="1470" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F9FF"/>
      <stop offset="1" stop-color="#EDF9F8"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FBFF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="warning" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D97706"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#4B5563"/>
    </marker>
    <style>
      .title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 600 20px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .tiny { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .tag { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .card { fill: url(#cardGradient); stroke: #D7E7F7; stroke-width: 2; }
      .primaryCard { fill: #EEF6FF; stroke: #BFDBFE; stroke-width: 2; }
      .successCard { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 2; }
      .warningCard { fill: #FFF7ED; stroke: #FED7AA; stroke-width: 2; }
      .lemon { fill: #FDE68A; }
      .navy { fill: #0F172A; }
      .blue { fill: #2563EB; }
      .teal { fill: #14B8A6; }
      .amber { fill: #F59E0B; }
      .rose { fill: #F43F5E; }
      .slate { fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bgGradient)"/>
  <text x="800" y="72" text-anchor="middle" class="title">Predictive Maintenance MLOps</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Sensor-driven failure risk pipeline for industrial operations</text>

  <g filter="url(#shadow)">
    <rect x="80" y="160" width="350" height="300" rx="26" class="card"/>
    <rect x="95" y="180" width="320" height="52" rx="16" fill="#E0F2FE"/>
    <text x="126" y="214" class="section">1. Data Sources</text>
    <g transform="translate(120 255)">
      <rect x="0" y="25" width="80" height="52" rx="12" fill="#DBEAFE"/>
      <path d="M20 32H60C69.4 32 77 39.6 77 49V63C77 72.4 69.4 80 60 80H20C10.6 80 3 72.4 3 63V49C3 39.6 10.6 32 20 32Z" fill="#2563EB" opacity="0.15"/>
      <path d="M18 53H62" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <path d="M23 43V34H57V43" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <path d="M40 27V19" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <path d="M28 19H52" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <circle cx="40" cy="65" r="8" fill="#F59E0B"/>
    </g>
    <g transform="translate(230 250)">
      <rect x="0" y="0" width="110" height="100" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
      <path d="M29 38H81" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M29 52H70" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M25 68H85" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <circle cx="16" cy="18" r="10" fill="#10B981"/>
      <path d="M27 18H46" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
      <path d="M66 18H89" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="120" y="400" class="label">Raw sensor telemetry</text>
    <text x="120" y="425" class="tiny">air temp · process temp · speed · torque · tool wear</text>
    <text x="120" y="452" class="label">Synthetic or real historian feed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="160" width="660" height="300" rx="26" class="primaryCard"/>
    <rect x="485" y="180" width="200" height="52" rx="16" fill="#DBEAFE"/>
    <text x="520" y="214" class="section">2. Data Processing</text>
    <g transform="translate(520 268)">
      <rect x="0" y="0" width="180" height="130" rx="20" fill="#FFFFFF" stroke="#BFDBFE"/>
      <rect x="26" y="24" width="128" height="16" rx="8" fill="#DBEAFE"/>
      <rect x="26" y="52" width="98" height="14" rx="7" fill="#E2E8F0"/>
      <rect x="26" y="74" width="112" height="14" rx="7" fill="#E2E8F0"/>
      <circle cx="142" cy="74" r="18" fill="#2563EB" opacity="0.15"/>
      <path d="M136 74L141 79L150 68" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="116" text-anchor="middle" class="tiny">Clean + validate</text>
    </g>
    <g transform="translate(740 268)">
      <rect x="0" y="0" width="180" height="130" rx="20" fill="#FFFFFF" stroke="#BFDBFE"/>
      <path d="M50 20L126 20C135 20 142 27 142 36V93C142 102 135 109 126 109H50C41 109 34 102 34 93V36C34 27 41 20 50 20Z" fill="#E0F2FE"/>
      <path d="M58 48H105" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 66H118" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 84H90" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <text x="90" y="116" text-anchor="middle" class="tiny">Stratified split</text>
    </g>
    <g transform="translate(960 268)">
      <rect x="0" y="0" width="130" height="130" rx="20" fill="#FFFFFF" stroke="#BFDBFE"/>
      <path d="M55 32C74 32 90 48 90 67C90 86 74 102 55 102C36 102 20 86 20 67C20 48 36 32 55 32Z" fill="#E0F2FE"/>
      <path d="M55 48V67L70 77" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="55" cy="67" r="3" fill="#2563EB"/>
      <text x="65" y="116" class="tiny" text-anchor="middle">Train + test</text>
    </g>
    <path d="M700 333H740" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M920 333H960" stroke="#64748B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="900" y="430" text-anchor="middle" class="label">data/processed/train.csv</text>
    <text x="900" y="455" text-anchor="middle" class="tiny">data/processed/test.csv</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1160" y="160" width="360" height="300" rx="26" class="successCard"/>
    <rect x="1185" y="180" width="205" height="52" rx="16" fill="#DCFCE7"/>
    <text x="1218" y="214" class="section">3. Model & Evaluation</text>
    <g transform="translate(1215 260)">
      <rect x="0" y="0" width="150" height="140" rx="20" fill="#FFFFFF" stroke="#A7F3D0"/>
      <path d="M39 47L75 28L111 47V83L75 102L39 83V47Z" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
      <path d="M75 28V58" stroke="#10B981" stroke-width="3"/>
      <path d="M39 47L75 58L111 47" stroke="#10B981" stroke-width="3"/>
      <circle cx="75" cy="75" r="10" fill="#10B981"/>
      <text x="75" y="122" text-anchor="middle" class="tiny">Classifier</text>
    </g>
    <g transform="translate(1385 270)">
      <rect x="0" y="0" width="110" height="120" rx="18" fill="#FFFFFF" stroke="#A7F3D0"/>
      <path d="M36 24H74" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M32 36H78" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M26 50H84" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <circle cx="55" cy="74" r="16" fill="#DCFCE7" stroke="#059669" stroke-width="3"/>
      <path d="M48 74H62" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <path d="M55 67V81" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <text x="55" y="102" text-anchor="middle" class="tiny">Metrics</text>
    </g>
    <text x="1220" y="425" class="label">Model artifact + tuned threshold</text>
    <text x="1220" y="451" class="tiny">Precision · Recall · F1 · ROC-AUC</text>
  </g>

