<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="1460" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF9F6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FAFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 600 20px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .section { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .tiny { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .card { fill: url(#card); stroke: #D7E7F7; stroke-width: 2; }
      .blue-card { fill: #EEF6FF; stroke: #BFDBFE; stroke-width: 2; }
      .green-card { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 2; }
      .soft { fill: #EFF6FF; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" class="title">Predictive Maintenance MLOps</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Sensor-driven failure risk pipeline for industrial operations</text>

  <!-- Top row -->
  <g filter="url(#shadow)">
    <rect x="70" y="155" width="330" height="280" rx="26" class="card"/>
    <rect x="90" y="175" width="290" height="48" rx="14" fill="#E0F2FE"/>
    <text x="125" y="207" class="section">1. Data Sources</text>

    <g transform="translate(110 241)">
      <rect x="0" y="0" width="100" height="70" rx="16" fill="#DBEAFE"/>
      <path d="M22 18H78C87.4 18 95 25.6 95 35V52C95 61.4 87.4 69 78 69H22C12.6 69 5 61.4 5 52V35C5 25.6 12.6 18 22 18Z" fill="#2563EB" opacity="0.15"/>
      <path d="M18 41H82" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <path d="M26 31V22H74V31" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 15V8" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <path d="M35 8H65" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="55" r="8" fill="#F59E0B"/>
    </g>

    <g transform="translate(226 233)">
      <rect x="0" y="0" width="120" height="92" rx="18" fill="#ECFDF5" stroke="#A7F3D0"/>
      <path d="M32 32H90" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M32 48H82" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M30 64H94" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <circle cx="18" cy="18" r="10" fill="#10B981"/>
      <path d="M30 18H46" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
      <path d="M72 18H90" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    </g>

    <text x="110" y="370" class="label">Raw sensor telemetry</text>
    <text x="110" y="395" class="tiny">air temp · process temp · speed · torque · tool wear</text>
    <text x="110" y="420" class="label">Synthetic or real historian feed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="440" y="155" width="700" height="280" rx="26" class="blue-card"/>
    <rect x="465" y="175" width="215" height="48" rx="14" fill="#DBEAFE"/>
    <text x="500" y="207" class="section">2. Data Processing</text>

    <g transform="translate(490 240)">
      <rect x="0" y="0" width="180" height="130" rx="20" fill="#FFFFFF" stroke="#BFDBFE"/>
      <rect x="26" y="24" width="128" height="16" rx="8" fill="#DBEAFE"/>
      <rect x="26" y="52" width="98" height="14" rx="7" fill="#E2E8F0"/>
      <rect x="26" y="74" width="112" height="14" rx="7" fill="#E2E8F0"/>
      <circle cx="142" cy="74" r="18" fill="#2563EB" opacity="0.15"/>
      <path d="M136 74L141 79L150 68" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="116" text-anchor="middle" class="tiny">Clean + validate</text>
    </g>

    <g transform="translate(700 240)">
      <rect x="0" y="0" width="180" height="130" rx="20" fill="#FFFFFF" stroke="#BFDBFE"/>
      <path d="M50 20L126 20C135 20 142 27 142 36V93C142 102 135 109 126 109H50C41 109 34 102 34 93V36C34 27 41 20 50 20Z" fill="#E0F2FE"/>
      <path d="M58 48H105" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 66H118" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <path d="M58 84H90" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <text x="90" y="116" text-anchor="middle" class="tiny">Stratified split</text>
    </g>

    <g transform="translate(910 240)">
      <rect x="0" y="0" width="160" height="130" rx="20" fill="#FFFFFF" stroke="#BFDBFE"/>
      <path d="M64 34C83 34 99 50 99 69C99 88 83 104 64 104C45 104 29 88 29 69C29 50 45 34 64 34Z" fill="#E0F2FE"/>
      <path d="M64 54V69L79 80" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="64" cy="69" r="3" fill="#2563EB"/>
      <text x="80" y="116" text-anchor="middle" class="tiny">Train + test</text>
    </g>

    <path d="M670 300H700" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M880 300H910" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <text x="790" y="410" text-anchor="middle" class="label">data/processed/train.csv</text>
    <text x="790" y="434" text-anchor="middle" class="tiny">data/processed/test.csv</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="155" width="350" height="280" rx="26" class="green-card"/>
    <rect x="1205" y="175" width="210" height="48" rx="14" fill="#DCFCE7"/>
    <text x="1240" y="207" class="section">3. Model &amp; Evaluation</text>

    <g transform="translate(1215 245)">
      <rect x="0" y="0" width="150" height="130" rx="20" fill="#FFFFFF" stroke="#A7F3D0"/>
      <path d="M39 44L75 24L111 44V81L75 101L39 81V44Z" fill="#ECFDF5" stroke="#10B981" stroke-width="3"/>
      <path d="M75 24V58" stroke="#10B981" stroke-width="3"/>
      <path d="M39 44L75 58L111 44" stroke="#10B981" stroke-width="3"/>
      <circle cx="75" cy="74" r="10" fill="#10B981"/>
      <text x="75" y="120" text-anchor="middle" class="tiny">Classifier</text>
    </g>

    <g transform="translate(1388 255)">
      <rect x="0" y="0" width="100" height="110" rx="18" fill="#FFFFFF" stroke="#A7F3D0"/>
      <path d="M34 26H66" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M28 40H72" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <path d="M24 54H76" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <circle cx="50" cy="72" r="16" fill="#DCFCE7" stroke="#059669" stroke-width="3"/>
      <path d="M42 72H58" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 64V80" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="98" text-anchor="middle" class="tiny">Metrics</text>
    </g>

    <text x="1230" y="410" class="label">Model artifact + tuned threshold</text>
    <text x="1230" y="434" class="tiny">Precision · Recall · F1 · ROC-AUC</text>
  </g>

  <!-- connector row -->
  <path d="M400 295H440" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1140 295H1180" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Bottom row -->
  <g filter="url(#shadow)">
    <rect x="200" y="520" width="1200" height="320" rx="28" class="card"/>
    <rect x="228" y="545" width="235" height="52" rx="16" fill="#F1F5F9"/>
    <text x="270" y="578" class="section">4. Serving + Monitoring</text>

    <g transform="translate(268 630)">
      <rect x="0" y="0" width="190" height="145" rx="20" fill="#FFFFFF" stroke="#D7E7F7"/>
      <rect x="20" y="18" width="150" height="92" rx="12" fill="#EFF6FF"/>
      <rect x="38" y="38" width="36" height="52" rx="8" fill="#2563EB"/>
      <rect x="82" y="30" width="72" height="12" rx="6" fill="#93C5FD"/>
      <rect x="82" y="50" width="58" height="12" rx="6" fill="#DBEAFE"/>
      <rect x="82" y="70" width="54" height="12" rx="6" fill="#DBEAFE"/>
      <text x="95" y="122" text-anchor="middle" class="tiny">FastAPI service</text>
    </g>

    <g transform="translate(528 630)">
      <rect x="0" y="0" width="210" height="145" rx="20" fill="#FFFFFF" stroke="#D7E7F7"/>
      <path d="M38 34H172" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
      <path d="M38 56H152" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
      <path d="M38 78H136" stroke="#14B8A6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="170" cy="78" r="18" fill="#CCFBF1" stroke="#14B8A6" stroke-width="3"/>
      <path d="M161 78H179" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
      <path d="M170 69V87" stroke="#14B8A6" stroke-width="3" stroke-linecap="round"/>
      <text x="105" y="122" text-anchor="middle" class="tiny">/predict + /predict/batch</text>
    </g>

    <g transform="translate(812 630)">
      <rect x="0" y="0" width="190" height="145" rx="20" fill="#FFFFFF" stroke="#D7E7F7"/>
      <path d="M38 34H152" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M62 60H128" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M48 86H142" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M95 16V94" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <circle cx="95" cy="94" r="18" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/>
      <text x="95" y="123" text-anchor="middle" class="tiny">/metrics</text>
    </g>

    <g transform="translate(1068 630)">
      <rect x="0" y="0" width="210" height="145" rx="20" fill="#FFFFFF" stroke="#D7E7F7"/>
      <path d="M62 32H148" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <rect x="72" y="48" width="72" height="46" rx="10" fill="#E0F2FE"/>
      <path d="M82 62H130" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
      <path d="M82 76H120" stroke="#0EA5E9" stroke-width="4" stroke-linecap="round"/>
      <path d="M56 104H154" stroke="#0EA5E9" stroke-width="5" stroke-linecap="round"/>
      <text x="105" y="122" text-anchor="middle" class="tiny">Drift monitoring</text>
    </g>

    <path d="M458 702H528" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M738 702H812" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M1002 702H1068" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <text x="800" y="815" text-anchor="middle" class="label">Operational feedback loop</text>
    <text x="800" y="840" text-anchor="middle" class="tiny">risk alerts · maintenance actions · monitoring reports</text>
  </g>

  <!-- vertical connector from model to serving -->
  <path d="M1355 435V520" stroke="#475569" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
